[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sgh"
version = "0.1.0"
description = "Structured Graph Harness — a DAG-based execution engine for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tanishq Mishra" }]
keywords = ["llm", "agents", "dag", "scheduler", "orchestration"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.7",
    "litellm>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "networkx>=3.3",
    "aiosqlite>=0.20",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
]
api = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
observability = [
    "langfuse>=2.40",
]

[project.scripts]
sgh = "sgh.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["sgh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100